name: Build

on:
  # This fork develops on claude/** branches and merges them to main through a
  # pull request, so without them here a feature branch gets no build until the
  # PR opens - which is exactly when a compile error is most expensive to find.
  push:
    branches: [ main, 'release/**', 'claude/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

jobs:
  build-windows:
    runs-on: windows-2022

    strategy:
      matrix:
        include:
          - build-flavour: debug
            output-subdir: _Comp64Debug
          - build-flavour: debugoptimized
            output-subdir: _Comp64DebugOptimized
          - build-flavour: release
            output-subdir: _Comp64Release

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false copy_output

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    # The x86 bridge is deliberately not built here. It exists so that 32 bit games can reach a 64
    # bit Remix across a process boundary; Dusklight is 64 bit and loads this d3d9.dll directly, so
    # nothing in this fork's workflow consumes that artifact. Building it cost roughly a third of
    # every run's wall clock and was the only reason _output had to be restructured into .trex\
    # after the x64 artifact was already uploaded.
    #
    # Upstream still needs it. If this fork is ever rebased onto a version that changes the bridge,
    # this is the deletion to reapply rather than a conflict to resolve.

  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "<!here> :rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
