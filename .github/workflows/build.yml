name: Build

on:
  # Session work happens on claude/** branches and lands on remix-auto-ver, so both are
  # built on push. Without them a branch gets no build until a pull request is opened
  # against main, which is exactly when a compile error is most expensive to find.
  push:
    branches: [ main, 'release/**', 'claude/**', remix-auto-ver ]
  pull_request:
    branches: [ main, 'release/**', remix-auto-ver ]
  # Builds any ref on demand, without needing a push to it. Usable from the Actions tab
  # only once this file is on the repository's default branch.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    # A push to claude/** already builds that commit, so a pull request opened from one would
    # build the same SHA a second time. The push run covers it; checks attach to the commit
    # either way, so the pull request still shows a result.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    env:
      BUILD_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'github-testing' || 'github-production' }}

    strategy:
      # One flavour failing should not cancel the others: when a compile error is
      # config-specific, knowing which configs it hits is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - build-flavour: debug
            output-subdir: _Comp64Debug
          - build-flavour: debugoptimized
            output-subdir: _Comp64DebugOptimized
          - build-flavour: release
            output-subdir: _Comp64Release

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false copy_output

    # When a command meson shells out to fails, meson prints only "A full log can be found at
    # ...\meson-logs\meson-log.txt" and exits - the actual error text lives in that file and in
    # whatever log the command itself wrote. Neither survives the runner, so a setup failure is
    # undiagnosable from the console output alone.
    - name: Dump build logs on failure
      if: failure()
      shell: pwsh
      run: |
        $mesonLog = "${{matrix.output-subdir}}\meson-logs\meson-log.txt"
        if (Test-Path $mesonLog) {
          Write-Host "::group::$mesonLog (last 60 lines)"
          Get-Content $mesonLog -Tail 60
          Write-Host "::endgroup::"
        } else {
          Write-Host "No meson log at $mesonLog"
        }
        Get-ChildItem -Path . -Filter update-deps.log -Recurse -Depth 3 -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "::group::$($_.FullName)"
            Get-Content $_.FullName -Tail 100
            Write-Host "::endgroup::"
          }

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs-${{github.run_number}}-${{matrix.build-flavour}}
        if-no-files-found: ignore
        path: |
          ${{matrix.output-subdir}}/meson-logs/*
          update-deps.log
          scripts-common/update-deps.log

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    - name: Move DXVK
      shell: pwsh
      run: |
        mkdir _output\.trex
        Move-Item -Path _output\*.dll -Destination _output\.trex\
        Move-Item -Path _output\*.pdb -Destination _output\.trex\
        Move-Item -Path _output\usd -Destination _output\.trex\usd

    - name: Build Bridge
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        pushd bridge
        . .\build_bridge_${{matrix.build-flavour}}.bat
        popd

    - name: Copy Bridge
      shell: pwsh
      run: |
        Copy-Item -Recurse -Path bridge\_output\* -Destination _output\ -Force

    - name: Upload x86 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x86-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        include-hidden-files: true
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\.trex\*.dll
          _output\.trex\*.exe
          _output\.trex\*.pdb
          _output\.trex\usd\*

  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "<!here> :rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
