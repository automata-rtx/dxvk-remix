name: Build

on:
  # Session work happens on claude/** branches, so those are built directly -
  # without them a feature branch gets no build until a PR opens, which is
  # exactly when a compile error is most expensive to find.
  #
  # Fixed-Function-dev is the branch this fork actually develops on (CLAUDE.md).
  # It was missing here, so every merge into it landed unbuilt and a bad
  # conflict resolution could sit undetected until someone else pulled it.
  push:
    branches: [ main, 'release/**', 'claude/**', Fixed-Function-dev ]
  pull_request:
    branches: [ main, 'release/**', Fixed-Function-dev ]

jobs:
  build-windows:
    runs-on: windows-2022

    # ONE CONFIG ON PURPOSE (2026-08-14, owner's instruction): a build we put out for
    # Remix/DX9 is Windows x86_64 only. debug and debugoptimized were removed from the
    # matrix below; every flavour here was already x86_64, so what this drops is three
    # copies of the same ~15 minute build, not any architecture coverage.
    #
    # Nothing was lost in the way that matters. Both tripwires this fork actually trips
    # survive on release: CheckRtInstanceSize is release/debugoptimized-only, so release
    # is precisely the flavour that must be kept for it, and the hashStructByMemory
    # static_assert is config-independent - on the run that prompted this it failed in
    # debug and fail-fast cancelled the other two mid-build, which is why the failure
    # looked debug-specific and was not.
    #
    # To restore a flavour, add its pair back here; nothing else in the file is
    # config-aware.
    strategy:
      matrix:
        include:
          - build-flavour: release
            output-subdir: _Comp64Release

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false copy_output

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    # The x86 bridge is deliberately not built here. It exists so that 32 bit games can reach a 64
    # bit Remix across a process boundary; Dusklight is 64 bit and loads this d3d9.dll directly, so
    # nothing in this fork's workflow consumes that artifact. Building it cost roughly a third of
    # every run's wall clock and was the only reason _output had to be restructured into .trex\
    # after the x64 artifact was already uploaded.
    #
    # Upstream still needs it. If this fork is ever rebased onto a version that changes the bridge,
    # this is the deletion to reapply rather than a conflict to resolve.

  # This fork has no SLACK_WEBHOOK_URL secret, so before 2026-08-14 this job failed with
  # "Missing input! Either a method or webhook is required to take action." every single
  # time a build failed - a second red job, on ubuntu, with nothing to do with the code,
  # sitting next to the real compile error and looking like part of it.
  #
  # The secrets context is not available in a job-level if, so the webhook is lifted into
  # the job env and the step is guarded on that instead. Set the secret and it starts
  # working again with no further change.
  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
    - name: Notify Slack
      if: ${{ env.SLACK_WEBHOOK_URL != '' }}
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ env.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "<!here> :rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
