name: Build

on:
  # Session work happens on claude/** branches and lands on remix-auto-ver, so both are
  # built on push. Without them a branch gets no build until a pull request is opened
  # against main, which is exactly when a compile error is most expensive to find.
  push:
    branches: [ main, 'release/**', 'claude/**', remix-auto-ver ]
  pull_request:
    branches: [ main, 'release/**', remix-auto-ver ]
  # Builds any ref on demand, without needing a push to it. Usable from the Actions tab
  # only once this file is on the repository's default branch.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    # A push to claude/** already builds that commit, so a pull request opened from one would
    # build the same SHA a second time. The push run covers it; checks attach to the commit
    # either way, so the pull request still shows a result.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    env:
      BUILD_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'github-testing' || 'github-production' }}

    strategy:
      matrix:
        include:
          - build-flavour: debug
            output-subdir: _Comp64Debug
          - build-flavour: debugoptimized
            output-subdir: _Comp64DebugOptimized
          - build-flavour: release
            output-subdir: _Comp64Release

    steps:
    - name: Setup variables
      uses: actions/github-script@v9
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Meson
      run: pip install meson==1.1.0

    - name: Build
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        . .\build_common.ps1
        PerformBuild -BuildFlavour ${{matrix.build-flavour}} -BuildSubDir ${{matrix.output-subdir}} -Backend ninja -EnableTracy false copy_output

    # When a command meson shells out to fails, meson prints only "A full log can be found at
    # ...\meson-logs\meson-log.txt" and exits - the actual error text lives in that file and in
    # whatever log the command itself wrote. Neither survives the runner, so a setup failure is
    # undiagnosable from the console output alone.
    - name: Dump build logs on failure
      if: failure()
      shell: pwsh
      run: |
        $mesonLog = "${{matrix.output-subdir}}\meson-logs\meson-log.txt"
        if (Test-Path $mesonLog) {
          Write-Host "::group::$mesonLog (last 300 lines)"
          Get-Content $mesonLog -Tail 300
          Write-Host "::endgroup::"
        } else {
          Write-Host "No meson log at $mesonLog"
        }
        Get-ChildItem -Path . -Filter update-deps.log -Recurse -Depth 3 -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "::group::$($_.FullName)"
            Get-Content $_.FullName -Tail 100
            Write-Host "::endgroup::"
          }

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs-${{github.run_number}}-${{matrix.build-flavour}}
        if-no-files-found: ignore
        path: |
          ${{matrix.output-subdir}}/meson-logs/*
          update-deps.log
          scripts-common/update-deps.log

    - name: Copy readme
      run: copy artifacts_readme.txt _output

    - name: Upload x64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x64-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        path: |
          _output\*.dll
          _output\*.pdb
          _output\*.txt
          _output\usd\*

    - name: Move DXVK
      shell: pwsh
      run: |
        mkdir _output\.trex
        Move-Item -Path _output\*.dll -Destination _output\.trex\
        Move-Item -Path _output\*.pdb -Destination _output\.trex\
        Move-Item -Path _output\usd -Destination _output\.trex\usd

    - name: Build Bridge
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
        pushd bridge
        . .\build_bridge_${{matrix.build-flavour}}.bat
        popd

    - name: Copy Bridge
      shell: pwsh
      run: |
        Copy-Item -Recurse -Path bridge\_output\* -Destination _output\ -Force

    - name: Upload x86 binaries
      uses: actions/upload-artifact@v7
      with:
        name: rtx-remix-for-x86-games-${{github.run_number}}-${{env.GITHUB_SHA_SHORT}}-${{matrix.build-flavour}}
        include-hidden-files: true
        path: |
          _output\*.dll
          _output\*.exe
          _output\*.pdb
          _output\*.txt
          _output\.trex\*.dll
          _output\.trex\*.exe
          _output\.trex\*.pdb
          _output\.trex\usd\*

  # TEMPORARY (remove once the answer is recorded): upstream 673dc2a repointed USD at
  # `open_usd`, which is not on either public packman remote - packman falls through to
  # NVGTL and demands NVM_GTLAPI_TOKEN, which no public fork has. This job reports which
  # USD packages from the project's own history a public runner can actually fetch, so
  # packman-external.xml can be repointed at one that works.
  usd-package-probe:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Probe USD packages against the public remotes
      shell: pwsh
      run: |
        $candidates = @(
          @{ n = 'open_usd';                               v = '25.11+07744417-windows-x86_64-release-nopython' }
          @{ n = 'open_usd';                               v = '25.11+07744417-windows-x86_64-debug-nopython' }
          @{ n = 'usd.py311.windows-x86_64.stock.release'; v = '0.25.11-gl.18041+v25.11.363a7c8d' }
          @{ n = 'usd.py311.windows-x86_64.stock.debug';   v = '0.25.11-gl.18041+v25.11.363a7c8d' }
          @{ n = 'nv-usd';                                 v = '22.11.nv.0.2.8268.07efe1d5-win64_py310_release-dev_omniverse' }
          @{ n = 'nv-usd';                                 v = '22.11.nv.0.2.8268.07efe1d5-win64_py310_debug-dev_omniverse' }
          @{ n = 'python';                                 v = '3.11.10+nv1-windows-x86_64' }
        )
        $results = @()
        foreach ($c in $candidates) {
          $id = "$($c.n)@$($c.v)"
          Write-Host "::group::$id"
          $xml = "<project toolsVersion=`"7.20`">`n  <dependency name=`"probe`" linkPath=`"./_probe`">`n    <package name=`"$($c.n)`" version=`"$($c.v)`" />`n  </dependency>`n</project>"
          Set-Content -Path "$PWD\probe.xml" -Value $xml -Encoding ascii
          & "$PWD\scripts-common\packman\packman.cmd" pull "$PWD\probe.xml" 2>&1 |
            Select-Object -Last 8 | ForEach-Object { Write-Host $_ }
          $results += [pscustomobject]@{ Package = $id; Ok = ($LASTEXITCODE -eq 0) }
          Remove-Item -Recurse -Force "$PWD\_probe" -ErrorAction SilentlyContinue
          Write-Host "::endgroup::"
        }
        Write-Host ""
        Write-Host "================== PROBE SUMMARY =================="
        foreach ($r in $results) {
          $state = if ($r.Ok) { "PUBLIC " } else { "BLOCKED" }
          Write-Host "$state  $($r.Package)"
        }
        Write-Host "==================================================="
        exit 0

  notify-slack-on-failure:
    runs-on: ubuntu-latest
    needs: build-windows
    if: ${{ failure() }}

    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "<!here> Build workflow failed for ${{ github.repository }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "<!here> :rotating-light-red: *Build workflow failed* for `${{ github.repository }}`"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Ref:*\n`${{ github.ref_name }}`"
                - type: mrkdwn
                  text: "*Commit:*\n`${{ github.sha }}`"
                - type: mrkdwn
                  text: "*Event:*\n`${{ github.event_name }}`"
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: View workflow run
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
